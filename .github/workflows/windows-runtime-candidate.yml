name: Validate unpublished Windows candidate

on:
  push:
    branches: ['validation/windows-1.8.15-startupfix-8e829986-20261009']
    paths: ['.github/workflows/windows-runtime-candidate.yml']

permissions: {}
concurrency:
  group: windows-candidate-1.8.15-startupfix-8e829986
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'matsumotojoho/linkjumkey-releases' && github.event.repository.private == false && github.actor == 'matsumotojoho' && github.ref == 'refs/heads/validation/windows-1.8.15-startupfix-8e829986-20261009'
    runs-on: windows-2025
    timeout-minutes: 10
    # Draft visibility requires repository push access. Only GET requests are used.
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Download and verify exact draft assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $repo = 'matsumotojoho/linkjumkey-releases'
          $tag = 'validation-windows-1.8.15-startupfix-8e829986-20261009'
          $root = Join-Path $env:RUNNER_TEMP 'candidate-validation'
          if (Test-Path -LiteralPath $root) { throw 'existing-directory' }
          New-Item -ItemType Directory -Path $root | Out-Null
          $expected = @{
            'LinkJumkey-Host-1.8.15-x64.zip' = @{sha256='a1796e0e6717d8c828642b6a4bb968194dce1b4bd1a33759aa1d8b147ceb7ff1';bytes=122026739}
            'windows-runtime-validation-1.8.15-startupfix-8e829986.zip' = @{sha256='57e426f8a6d64746b43cf140492a8b195b352e96c37348284f02aebd2d8f50a1';bytes=39453}
          }
          $handler = [Net.Http.HttpClientHandler]::new()
          $handler.AllowAutoRedirect = $false
          $api = [Net.Http.HttpClient]::new($handler)
          $api.Timeout = [TimeSpan]::FromMinutes(3)
          $api.DefaultRequestHeaders.UserAgent.ParseAdd('candidate-validation')
          $api.DefaultRequestHeaders.Authorization = [Net.Http.Headers.AuthenticationHeaderValue]::new('Bearer', $env:GH_TOKEN)
          $api.DefaultRequestHeaders.Add('X-GitHub-Api-Version', '2022-11-28')
          try {
            $api.DefaultRequestHeaders.Accept.ParseAdd('application/vnd.github+json')
            # The tag endpoint is for published releases; authenticated listing includes drafts.
            $response = $api.GetAsync("https://api.github.com/repos/$repo/releases?per_page=100").GetAwaiter().GetResult()
            if ([int]$response.StatusCode -ne 200) { throw 'draft-metadata-unavailable' }
            $releases = $response.Content.ReadAsStringAsync().GetAwaiter().GetResult() | ConvertFrom-Json
            $response.Dispose()
            $matches = @($releases | Where-Object { $_.tag_name -eq $tag })
            if ($matches.Count -ne 1) { throw 'exact-draft-not-found' }
            $release = $matches[0]
            if (-not $release.draft -or $release.published_at -or $release.tag_name -ne $tag) { throw 'expected-unpublished-draft-only' }
            if (@($release.assets).Count -ne 2) { throw 'expected-two-assets' }
            $api.DefaultRequestHeaders.Accept.Clear()
            $api.DefaultRequestHeaders.Accept.ParseAdd('application/octet-stream')
            foreach ($name in $expected.Keys) {
              $assets = @($release.assets | Where-Object { $_.name -eq $name })
              if ($assets.Count -ne 1 -or $assets[0].state -ne 'uploaded' -or [long]$assets[0].size -ne [long]$expected[$name].bytes) { throw 'exact-asset-not-found' }
              $assetId = [long]$assets[0].id
              $response = $api.GetAsync("https://api.github.com/repos/$repo/releases/assets/$assetId", [Net.Http.HttpCompletionOption]::ResponseHeadersRead).GetAwaiter().GetResult()
              $plain = $null
              try {
                if ([int]$response.StatusCode -eq 302) {
                  $location = $response.Headers.Location
                  if ($location.Scheme -ne 'https' -or $location.Host -ne 'release-assets.githubusercontent.com' -or $location.UserInfo -ne '' -or $location.Port -ne 443) { throw 'unexpected-asset-redirect' }
                  $response.Dispose()
                  # Never forward the API token to a signed download URL.
                  $plainHandler = [Net.Http.HttpClientHandler]::new()
                  $plainHandler.AllowAutoRedirect = $false
                  $plain = [Net.Http.HttpClient]::new($plainHandler)
                  $plain.Timeout = [TimeSpan]::FromMinutes(3)
                  $response = $plain.GetAsync($location, [Net.Http.HttpCompletionOption]::ResponseHeadersRead).GetAwaiter().GetResult()
                }
                if ([int]$response.StatusCode -ne 200) { throw 'asset-download-failed' }
                $file = Join-Path $root $name
                $stream = [IO.File]::Create($file)
                try { $response.Content.CopyToAsync($stream).GetAwaiter().GetResult() } finally { $stream.Dispose() }
                if ((Get-Item -LiteralPath $file).Length -ne [long]$expected[$name].bytes) { throw 'asset-size-mismatch' }
                if ((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected[$name].sha256) { throw 'asset-hash-mismatch' }
              } finally { $response.Dispose(); if ($plain) { $plain.Dispose() } }
            }
            Expand-Archive -LiteralPath (Join-Path $root 'LinkJumkey-Host-1.8.15-x64.zip') -DestinationPath (Join-Path $root 'candidate')
            $harnessZip = Join-Path $root 'windows-runtime-validation-1.8.15-startupfix-8e829986.zip'
            $allowed = @('manifest.json','storage-manifest.json','probe-storage-runtime.cjs','classify-error.cjs','probe-live-mcp.cjs','observe-discovery.cjs','probe-package.cjs','run-runtime-smoke.ps1','scripts/windows-key-native-smoke.cjs','scripts/windows-key-native-smoke.ps1','test/host-library-storage-area.test.js','test/windows-native-file-runtime.test.js')
            $archive = [IO.Compression.ZipFile]::OpenRead($harnessZip)
            try {
              if ($archive.Entries.Count -ne $allowed.Count -or (@($archive.Entries.FullName | Sort-Object) -join '|') -ne (@($allowed | Sort-Object) -join '|')) { throw 'harness-entry-set' }
              foreach ($entry in $archive.Entries) {
                $mode = ($entry.ExternalAttributes -shr 16) -band 61440
                if ($entry.Length -gt 1048576 -or $mode -eq 40960) { throw 'harness-entry-type' }
              }
            } finally { $archive.Dispose() }
            Expand-Archive -LiteralPath $harnessZip -DestinationPath (Join-Path $root 'harness')
            Write-Output 'Two exact draft assets verified; no release or feed was changed.'
          } catch {
            Write-Error 'Draft acquisition or checksum verification failed. No candidate was executed.'
            exit 1
          } finally { $api.Dispose(); Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue }

      - name: Run isolated Windows candidate checks without API credentials
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'candidate-validation'
          try {
            & (Join-Path $root 'harness/run-runtime-smoke.ps1') -CandidateDirectory (Join-Path $root 'candidate') -OutputDirectory (Join-Path $root 'results')
            exit $LASTEXITCODE
          } catch {
            Write-Error 'Candidate validation could not complete; inspect its safe summary.'
            exit 1
          }
